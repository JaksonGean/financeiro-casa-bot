<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro Casa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f13;--surface:#17171e;--surface2:#1e1e28;--border:#2a2a38;
    --accent:#c8f060;--accent2:#60c8f0;--accent3:#f060a8;
    --text:#f0f0f5;--text2:#8888a8;
    --entrada:#60f0a8;--saida:#f06080;--pagar:#f0c060;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px;}

  header{padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-0.5px;}
  .logo span{color:var(--accent);}
  .header-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
  select:hover,button:hover{border-color:var(--accent);color:var(--accent);}
  .btn-refresh{background:var(--accent);color:#0f0f13;font-weight:600;border:none;}
  .btn-refresh:hover{background:#d4f570;color:#0f0f13;}
  .btn-ocultar{background:var(--surface2);border:1px solid var(--border);font-size:13px;}

  main{padding:24px 32px;max-width:1400px;margin:0 auto;}
  #status-bar{text-align:center;padding:40px;color:var(--text2);}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* CARDS */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;}
  .card:hover{transform:translateY(-2px);border-color:var(--accent);}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
  .card.verde::before{background:var(--entrada);}
  .card.vermelho::before{background:var(--saida);}
  .card.amarelo::before{background:var(--pagar);}
  .card.azul::before{background:var(--accent2);}
  .card.roxo::before{background:var(--accent3);}
  .card.cinza::before{background:var(--text2);}
  .card-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:8px;}
  .card-value{font-family:'DM Serif Display',serif;font-size:24px;line-height:1;margin-bottom:4px;transition:filter .3s;}
  .card-sub{font-size:11px;color:var(--text2);}
  .positivo{color:var(--entrada);}
  .negativo{color:var(--saida);}
  .aviso{color:var(--pagar);}
  .oculto .card-value{filter:blur(8px);user-select:none;}

  /* SEÇÃO */
  .section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}

  /* CHARTS */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .chart-card.wide{grid-column:1/-1;}
  .chart-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:16px;}
  .chart-wrap{position:relative;height:240px;}
  .chart-wrap.tall{height:300px;}

  /* TABLES */
  .table-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .table-card.wide{grid-column:1/-1;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);padding:0 0 8px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;}
  .badge-entrada{background:#60f0a820;color:var(--entrada);}
  .badge-saida{background:#f0608020;color:var(--saida);}
  .badge-pagar{background:#f0c06020;color:var(--pagar);}

  /* VENCIMENTOS */
  .venc-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
  .venc-item:last-child{border-bottom:none;}
  .venc-dias{font-family:'DM Serif Display',serif;font-size:20px;min-width:38px;text-align:center;}
  .venc-dias.urgente{color:var(--saida);}
  .venc-dias.proximo{color:var(--pagar);}
  .venc-dias.ok{color:var(--entrada);}
  .venc-info{flex:1;}
  .venc-nome{font-weight:500;font-size:13px;}
  .venc-data{font-size:11px;color:var(--text2);margin-top:1px;}
  .venc-valor{font-weight:600;font-size:13px;}

  /* BARRAS */
  .cat-bar-item{margin-bottom:11px;}
  .cat-bar-header{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;}
  .cat-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:3px;transition:width .8s ease;}

  /* METAS */
  .meta-item{margin-bottom:16px;}
  .meta-item:last-child{margin-bottom:0;}
  .meta-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
  .meta-nome{font-weight:600;font-size:13px;}
  .meta-tipo{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);margin-top:2px;}
  .meta-valores{text-align:right;font-size:12px;}
  .meta-gasto{font-weight:600;font-size:13px;}
  .meta-restante{color:var(--text2);font-size:11px;margin-top:1px;}
  .meta-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:4px;}
  .meta-fill{height:100%;border-radius:4px;transition:width 1s ease;}
  .meta-fill.ok{background:var(--entrada);}
  .meta-fill.alerta{background:var(--pagar);}
  .meta-fill.ultrapassado{background:var(--saida);}
  .meta-fill.investimento{background:var(--accent2);}
  .meta-pct{font-size:11px;color:var(--text2);}
  .meta-aviso{font-size:11px;color:var(--saida);font-weight:600;margin-top:2px;}
  .meta-ok{font-size:11px;color:var(--entrada);font-weight:600;margin-top:2px;}

  /* CONTAS */
  .conta-item{padding:12px 0;border-bottom:1px solid var(--border);}
  .conta-item:last-child{border-bottom:none;}
  .conta-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .conta-nome{font-weight:600;font-size:13px;}
  .conta-tipo{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;}
  .conta-saldo{font-family:'DM Serif Display',serif;font-size:18px;transition:filter .3s;}
  .oculto .conta-saldo{filter:blur(8px);user-select:none;}

  /* COMPARATIVO */
  .comp-item{padding:10px 0;border-bottom:1px solid var(--border);}
  .comp-item:last-child{border-bottom:none;}
  .comp-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;}
  .comp-mes{font-weight:600;color:var(--text);}
  .comp-delta{font-size:11px;font-weight:600;}
  .comp-bars{display:flex;flex-direction:column;gap:3px;}
  .comp-bar-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);}
  .comp-bar{height:6px;border-radius:3px;transition:width .8s ease;min-width:2px;}
  .comp-val{white-space:nowrap;min-width:70px;text-align:right;}

  /* PESSOA */
  .pessoa-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .pessoa-item:last-child{border-bottom:none;}
  .pessoa-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;}
  .pessoa-info{flex:1;}
  .pessoa-nome{font-weight:600;font-size:13px;}
  .pessoa-cat{font-size:11px;color:var(--text2);margin-top:1px;}
  .pessoa-valor{font-weight:600;font-size:14px;}

  .empty{text-align:center;padding:28px;color:var(--text2);font-size:13px;}
  .erro-box{background:#f0608015;border:1px solid #f0608040;border-radius:12px;padding:18px 22px;margin-bottom:18px;font-size:13px;color:var(--saida);}

  @media(max-width:768px){
    header{padding:14px;}
    main{padding:14px;}
    .charts-grid,.table-grid{grid-template-columns:1fr;}
    .chart-card.wide,.table-card.wide{grid-column:auto;}
    .cards-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<header>
  <div class="logo">💰 Financeiro<span>Casa</span></div>
  <div class="header-controls">
    <select id="sel-mes"><option value="todos">Todos os meses</option></select>
    <select id="sel-categoria"><option value="todas">Todas categorias</option></select>
    <button class="btn-ocultar" onclick="toggleOcultar()" id="btn-ocultar">👁 Mostrar saldos</button>
    <button class="btn-refresh" onclick="carregarDados()">↻ Atualizar</button>
  </div>
</header>

<main>
  <div id="status-bar"><div class="spinner"></div>Carregando dados…</div>
  <div id="dashboard" style="display:none"></div>
</main>

<script>
const SHEET_ID  = '1R0w5a29N-G3SMs-uhgHMvO1RQvABnrYaeGPnCc3qmug';
const URLS = {
  dados:  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=P%C3%A1gina1`,
  metas:  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=P%C3%A1gina2`,
  contas: `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=P%C3%A1gina3`,
};

let dadosOriginais = [], metasOriginais = {}, contasOriginais = [];
let chartInstances = {}, saldosVisiveis = false;
const CORES = ['#c8f060','#60c8f0','#f060a8','#60f0a8','#f0c060','#a860f0','#f08060','#60f0e0','#f0f060','#6080f0'];

// ─── OCULTAR SALDOS ───────────────────────────────────────────────────────────
function toggleOcultar() {
  saldosVisiveis = !saldosVisiveis;
  document.getElementById('dashboard').classList.toggle('oculto', !saldosVisiveis);
  document.getElementById('btn-ocultar').textContent = saldosVisiveis ? '🙈 Ocultar saldos' : '👁 Mostrar saldos';
}

// ─── LOAD ────────────────────────────────────────────────────────────────────
async function carregarDados() {
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').innerHTML = '<div class="spinner"></div>Carregando dados…';
  document.getElementById('dashboard').style.display = 'none';
  try {
    const [r1,r2,r3] = await Promise.all(Object.values(URLS).map(u => fetch(u+'&t='+Date.now())));
    dadosOriginais  = parseCSV(await r1.text());
    metasOriginais  = r2.ok ? parseMetas(await r2.text()) : {};
    contasOriginais = r3.ok ? parseContas(await r3.text()) : [];
    popularFiltros();
    renderDashboard();
  } catch(err) {
    document.getElementById('status-bar').innerHTML =
      `<div class="erro-box">⚠️ <strong>Não foi possível carregar.</strong><br><br>Planilha precisa estar pública (compartilhar → qualquer pessoa → leitor)<br><small>${err.message}</small></div>`;
  }
}

// ─── PARSERS ─────────────────────────────────────────────────────────────────
function parseCSV(csv) {
  const linhas = csv.trim().split('\n'); const dados = [];
  for (let i=1;i<linhas.length;i++) {
    const c = parseLinha(linhas[i]);
    if (!c[0]||c[0].trim()==='') continue;
    dados.push({
      data:c[0]?.replace(/"/g,'').trim()||'', descricao:c[1]?.replace(/"/g,'').trim()||'',
      valor:parseFloat((c[2]?.replace(/"/g,'').replace(',','.')||'0'))||0,
      categoria:c[3]?.replace(/"/g,'').trim()||'Outros', quem:c[4]?.replace(/"/g,'').trim()||'',
      tipo:c[5]?.replace(/"/g,'').trim()||'Saída', forma:c[6]?.replace(/"/g,'').trim()||'',
      parcelas:c[7]?.replace(/"/g,'').trim()||'', obs:c[8]?.replace(/"/g,'').trim()||'',
      mesAno:c[9]?.replace(/"/g,'').trim()||'', conta:c[11]?.replace(/"/g,'').trim()||'',
      quitado:(c[8]?.replace(/"/g,'').trim()||'').toLowerCase().startsWith('✅ quitado'),
    });
  }
  return dados;
}
function parseMetas(csv) {
  const linhas = csv.trim().split('\n'); const m = {};
  for (let i=1;i<linhas.length;i++) {
    const c = parseLinha(linhas[i]);
    const cat=(c[0]||'').replace(/"/g,'').trim(), val=parseFloat((c[1]||'0').replace(/"/g,'').replace(',','.'))||0;
    const tipo=(c[2]||'Gasto').replace(/"/g,'').trim(), rm=(c[3]||'').replace(/"/g,'').trim();
    if (cat&&val) { if (!m[cat]||rm===mesAtual()) m[cat]={meta:val,tipo}; }
  }
  return m;
}
function parseContas(csv) {
  const linhas = csv.trim().split('\n'); const contas = [];
  for (let i=1;i<linhas.length;i++) {
    const c = parseLinha(linhas[i]);
    const nome=(c[0]||'').replace(/"/g,'').trim();
    if (!nome) continue;
    contas.push({
      nome, tipo:(c[1]||'').replace(/"/g,'').trim(),
      limite:parseFloat((c[2]||'0').replace(/"/g,'').replace(/[R$\s.]/g,'').replace(',','.'))||0,
      saldoInicial:parseFloat((c[3]||'0').replace(/"/g,'').replace(/[R$\s.]/g,'').replace(',','.'))||0,
    });
  }
  return contas;
}
function parseLinha(linha) {
  const r=[]; let cur='',inQ=false;
  for (let i=0;i<linha.length;i++) {
    const c=linha[i];
    if (c==='"'){inQ=!inQ;}
    else if (c===','&&!inQ){r.push(cur);cur='';}
    else{cur+=c;}
  }
  r.push(cur); return r;
}

// ─── FILTROS ─────────────────────────────────────────────────────────────────
function popularFiltros() {
  const meses=[...new Set(dadosOriginais.map(d=>d.mesAno).filter(Boolean))].sort();
  const cats=[...new Set(dadosOriginais.map(d=>d.categoria).filter(Boolean))].sort();
  const selMes=document.getElementById('sel-mes');
  selMes.innerHTML='<option value="todos">Todos os meses</option>';
  meses.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=formatarMesAno(m);if(m===mesAtual())o.selected=true;selMes.appendChild(o);});
  const selCat=document.getElementById('sel-categoria');
  selCat.innerHTML='<option value="todas">Todas categorias</option>';
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;selCat.appendChild(o);});
  selMes.onchange=renderDashboard; selCat.onchange=renderDashboard;
}
function filtrarDados() {
  const mes=document.getElementById('sel-mes').value, cat=document.getElementById('sel-categoria').value;
  return dadosOriginais.filter(d=>(mes==='todos'||d.mesAno===mes)&&(cat==='todas'||d.categoria===cat));
}
function mesAtual(){const h=new Date();return `${String(h.getMonth()+1).padStart(2,'0')}/${h.getFullYear()}`;}
function formatarMesAno(s){if(!s)return s;const meses=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];const[m,a]=s.split('/');return `${meses[parseInt(m)]||m}/${a}`;}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderDashboard() {
  const dados=filtrarDados(); destroyCharts();
  const entradas=dados.filter(d=>d.tipo==='Entrada');
  const saidas=dados.filter(d=>d.tipo==='Saída');
  const aPagar=dados.filter(d=>d.tipo==='A Pagar' && !d.quitado);
  const totEnt=entradas.reduce((s,d)=>s+d.valor,0);
  const totSai=saidas.reduce((s,d)=>s+d.valor,0);
  const totPag=aPagar.reduce((s,d)=>s+d.valor,0);
  const saldo=totEnt-totSai;
  const totInvest=saidas.filter(d=>d.categoria==='Investimento').reduce((s,d)=>s+d.valor,0);
  const gastosPorCat={};
  saidas.forEach(d=>{gastosPorCat[d.categoria]=(gastosPorCat[d.categoria]||0)+d.valor;});
  const mesSel=document.getElementById('sel-mes').value;

  // Saldo por conta (usando todos os dados, não só filtrado)
  const saldoContas=calcularSaldoContas();

  const html=`
    ${renderCardsFinanceiros(totEnt,totSai,totPag,saldo,totInvest,saldoContas)}
    ${renderMetas(gastosPorCat,mesSel)}
    ${renderContasCard(saldoContas)}
    ${renderChartsGrid()}
    ${renderComparativo()}
    ${renderTablesGrid(saidas,aPagar,dados)}
  `;
  const dash=document.getElementById('dashboard');
  dash.innerHTML=html;
  // Mantém estado de visibilidade
  if (!saldosVisiveis) dash.classList.add('oculto');
  dash.style.display='block';
  document.getElementById('status-bar').style.display='none';
  setTimeout(()=>{
    renderChartBarras(dados);renderChartPizza(saidas);
    renderChartSaldo(dadosOriginais);renderChartFormas(saidas);
    renderChartPessoas(saidas);
  },50);
}

// ─── CARDS FINANCEIROS ────────────────────────────────────────────────────────
function renderCardsFinanceiros(totEnt,totSai,totPag,saldo,totInvest,saldoContas) {
  // Calcula saldo corrente (só contas correntes, sem cartão crédito)
  let saldoCorrente=0;
  contasOriginais.forEach(c=>{
    if (c.tipo!=='Cartão crédito') saldoCorrente+=(saldoContas[c.nome]||0);
  });
  const previsao=saldoCorrente-totPag;

  return `
  <div style="margin-bottom:24px">
    <div class="section-title">📊 Visão Geral — ${formatarMesAno(document.getElementById('sel-mes').value==='todos'?mesAtual():document.getElementById('sel-mes').value)}</div>
    <div class="cards-grid">
      <div class="card verde">
        <div class="card-label">Entradas</div>
        <div class="card-value positivo">R$ ${fmt(totEnt)}</div>
        <div class="card-sub">período selecionado</div>
      </div>
      <div class="card vermelho">
        <div class="card-label">Saídas</div>
        <div class="card-value negativo">R$ ${fmt(totSai)}</div>
        <div class="card-sub">período selecionado</div>
      </div>
      <div class="card ${saldo>=0?'verde':'vermelho'}">
        <div class="card-label">Saldo do Período</div>
        <div class="card-value ${saldo>=0?'positivo':'negativo'}">R$ ${fmt(Math.abs(saldo))}</div>
        <div class="card-sub">${saldo>=0?'✓ positivo':'⚠ negativo'}</div>
      </div>
      <div class="card azul">
        <div class="card-label">Saldo em Conta</div>
        <div class="card-value" style="color:var(--accent2)">R$ ${fmt(saldoCorrente)}</div>
        <div class="card-sub">contas correntes</div>
      </div>
      <div class="card roxo">
        <div class="card-label">Aplicado no Mês</div>
        <div class="card-value" style="color:var(--accent3)">R$ ${fmt(totInvest)}</div>
        <div class="card-sub">categoria Investimento</div>
      </div>
      <div class="card amarelo">
        <div class="card-label">Contas a Pagar</div>
        <div class="card-value aviso">R$ ${fmt(totPag)}</div>
        <div class="card-sub">lançadas no período</div>
      </div>
      <div class="card ${previsao>=0?'verde':'vermelho'}">
        <div class="card-label">Previsão Final</div>
        <div class="card-value ${previsao>=0?'positivo':'negativo'}">R$ ${fmt(Math.abs(previsao))}</div>
        <div class="card-sub">saldo conta − a pagar</div>
      </div>
    </div>
  </div>`;
}

// ─── SALDO CONTAS ─────────────────────────────────────────────────────────────
function calcularSaldoContas() {
  const saldos={};
  contasOriginais.forEach(c=>{ saldos[c.nome]=c.saldoInicial||0; });
  dadosOriginais.forEach(d=>{
    const conta=d.conta; if (!conta) return;
    if (!saldos[conta]) saldos[conta]=0;
    if (d.tipo==='Entrada') saldos[conta]+=d.valor;
    else if (d.tipo==='Saída') saldos[conta]-=d.valor;
  });
  return saldos;
}

function renderContasCard(saldoContas) {
  if (!contasOriginais.length) return '';
  const mesSel=document.getElementById('sel-mes').value;
  const mes=mesSel==='todos'?mesAtual():mesSel;

  // Fatura por cartão no mês selecionado
  const faturas={};
  dadosOriginais.filter(d=>d.mesAno===mes&&d.tipo==='Saída').forEach(d=>{
    if (d.conta) faturas[d.conta]=(faturas[d.conta]||0)+d.valor;
  });

  const items=contasOriginais.map(c=>{
    if (c.tipo==='Cartão crédito') {
      const usado=faturas[c.nome]||0;
      const disp=c.limite-usado;
      const pct=Math.min(100,(usado/c.limite*100)||0);
      const fillClass=pct>=90?'ultrapassado':pct>=70?'alerta':'ok';
      return `
      <div class="conta-item">
        <div class="conta-header">
          <div><div class="conta-nome">💳 ${c.nome}</div><div class="conta-tipo">Cartão crédito</div></div>
          <div style="text-align:right">
            <div class="conta-saldo aviso">R$ ${fmt(usado)}</div>
            <div style="font-size:11px;color:var(--text2)">de R$ ${fmt(c.limite)} · disp. R$ ${fmt(disp)}</div>
          </div>
        </div>
        <div class="meta-track"><div class="meta-fill ${fillClass}" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="meta-pct">${pct.toFixed(0)}% usado</div>
      </div>`;
    } else {
      const saldo=saldoContas[c.nome]||0;
      return `
      <div class="conta-item">
        <div class="conta-header">
          <div><div class="conta-nome">🏦 ${c.nome}</div><div class="conta-tipo">${c.tipo}</div></div>
          <div class="conta-saldo ${saldo>=0?'positivo':'negativo'}">R$ ${fmt(saldo)}</div>
        </div>
      </div>`;
    }
  }).join('');

  return `
  <div style="margin-bottom:24px">
    <div class="section-title">🏦 Contas e Cartões</div>
    <div class="chart-card">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 40px">
        ${items}
      </div>
    </div>
  </div>`;
}

// ─── METAS ────────────────────────────────────────────────────────────────────
function renderMetas(gastosPorCat,mesSel) {
  if (!Object.keys(metasOriginais).length) return '';
  const items=Object.entries(metasOriginais).map(([cat,{meta,tipo}])=>{
    const gasto=gastosPorCat[cat]||0, restante=meta-gasto;
    const pct=Math.min(100,(gasto/meta*100));
    let fillClass,statusHtml;
    if (tipo==='Investimento') {
      fillClass='investimento';
      statusHtml=gasto>=meta?`<div class="meta-ok">✓ Meta atingida!</div>`:`<div class="meta-pct">Faltam R$ ${fmt(restante)}</div>`;
    } else {
      fillClass=pct>=100?'ultrapassado':pct>=80?'alerta':'ok';
      statusHtml=pct>=100?`<div class="meta-aviso">⚠ Passou R$ ${fmt(Math.abs(restante))}</div>`:`<div class="meta-pct">Saldo: R$ ${fmt(restante)}</div>`;
    }
    return `
    <div class="meta-item">
      <div class="meta-header">
        <div><div class="meta-nome">${cat}</div><div class="meta-tipo">${tipo}</div></div>
        <div class="meta-valores">
          <div class="meta-gasto ${pct>=100?'negativo':pct>=80?'aviso':'positivo'}">R$ ${fmt(gasto)}</div>
          <div class="meta-restante">meta R$ ${fmt(meta)}</div>
        </div>
      </div>
      <div class="meta-track"><div class="meta-fill ${fillClass}" style="width:${pct.toFixed(1)}%"></div></div>
      <div style="display:flex;justify-content:space-between">${statusHtml}<div class="meta-pct">${pct.toFixed(0)}%</div></div>
    </div>`;
  }).join('');
  return `
  <div style="margin-bottom:24px">
    <div class="section-title">🎯 Metas</div>
    <div class="chart-card">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 40px">${items}</div>
    </div>
  </div>`;
}

// ─── CHARTS ───────────────────────────────────────────────────────────────────
function renderChartsGrid() {
  return `
  <div class="charts-grid" style="margin-bottom:24px">
    <div class="chart-card wide"><div class="chart-title">📊 Entradas vs Saídas por Mês</div><div class="chart-wrap tall"><canvas id="chart-barras"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🥧 Gastos por Categoria</div><div class="chart-wrap"><canvas id="chart-pizza"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">💳 Forma de Pagamento</div><div class="chart-wrap"><canvas id="chart-formas"></canvas></div></div>
    <div class="chart-card wide"><div class="chart-title">📈 Evolução do Saldo</div><div class="chart-wrap"><canvas id="chart-saldo"></canvas></div></div>
  </div>`;
}

// ─── COMPARATIVO ──────────────────────────────────────────────────────────────
function renderComparativo() {
  const porMes={};
  dadosOriginais.forEach(d=>{
    if (!d.mesAno) return;
    if (!porMes[d.mesAno]) porMes[d.mesAno]={ent:0,sai:0};
    if (d.tipo==='Entrada') porMes[d.mesAno].ent+=d.valor;
    else if (d.tipo==='Saída') porMes[d.mesAno].sai+=d.valor;
  });
  const meses=Object.keys(porMes).sort().slice(-6);
  if (meses.length < 2) return '';
  const maxVal=Math.max(...meses.flatMap(m=>[porMes[m].ent,porMes[m].sai]))||1;

  const rows=meses.reverse().map((m,i)=>{
    const {ent,sai}=porMes[m];
    const saldoM=ent-sai;
    const prev=meses[i+1]?porMes[meses[i+1]].sai:null;
    const delta=prev!==null?sai-prev:null;
    const deltaHtml=delta!==null?`<span class="comp-delta ${delta>0?'negativo':'positivo'}">${delta>0?'▲':'▼'} R$ ${fmt(Math.abs(delta))}</span>`:'';
    return `
    <div class="comp-item">
      <div class="comp-header"><span class="comp-mes">${formatarMesAno(m)}</span>${deltaHtml}</div>
      <div class="comp-bars">
        <div class="comp-bar-row">
          <span style="width:50px;color:var(--entrada)">Ent</span>
          <div class="comp-bar" style="width:${(ent/maxVal*100).toFixed(1)}%;background:var(--entrada)"></div>
          <span class="comp-val positivo">R$ ${fmt(ent)}</span>
        </div>
        <div class="comp-bar-row">
          <span style="width:50px;color:var(--saida)">Saí</span>
          <div class="comp-bar" style="width:${(sai/maxVal*100).toFixed(1)}%;background:var(--saida)"></div>
          <span class="comp-val negativo">R$ ${fmt(sai)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="table-grid" style="margin-bottom:24px">
    <div class="table-card">
      <div class="chart-title">📅 Comparativo Últimos 6 Meses</div>
      ${rows||'<div class="empty">Dados insuficientes</div>'}
    </div>
    <div class="chart-card" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px">
      <div class="chart-title">👤 Gastos por Pessoa</div>
      <div class="chart-wrap"><canvas id="chart-pessoas"></canvas></div>
    </div>
  </div>`;
}

// ─── TABLES ───────────────────────────────────────────────────────────────────
function renderTablesGrid(saidas,aPagar,dados) {
  return `
  <div class="table-grid">
    ${renderTopCategorias(saidas)}
    ${renderVencimentos(aPagar)}
    ${renderUltimosLancamentos(dados)}
  </div>`;
}

function renderTopCategorias(saidas) {
  const por={};
  saidas.forEach(d=>{por[d.categoria]=(por[d.categoria]||0)+d.valor;});
  const sorted=Object.entries(por).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]||1;
  const bars=sorted.map(([cat,val],i)=>`
    <div class="cat-bar-item">
      <div class="cat-bar-header"><span>${cat}</span><span style="color:var(--text2)">R$ ${fmt(val)}</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(val/max*100).toFixed(1)}%;background:${CORES[i%CORES.length]}"></div></div>
    </div>`).join('');
  return `<div class="table-card"><div class="chart-title">🏷️ Top Categorias</div>${sorted.length?bars:'<div class="empty">Nenhum dado</div>'}</div>`;
}

function renderVencimentos(aPagar) {
  const agoraBR=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
  const hoje=new Date(agoraBR.getFullYear(),agoraBR.getMonth(),agoraBR.getDate());
  const items=aPagar.map(d=>{
    const p=d.data.split('/');
    const dt=p.length>=3?new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0])):null;
    const dias=dt?Math.round((dt-hoje)/86400000):null;
    return{...d,dt,dias};
  }).sort((a,b)=>(a.dias||999)-(b.dias||999)).slice(0,8);
  const rows=items.map(item=>{
    let dc='ok',dl=item.dias!==null?`${item.dias}d`:'?';
    if(item.dias!==null){if(item.dias<0){dc='urgente';dl='Venc.';}else if(item.dias<=3)dc='urgente';else if(item.dias<=7)dc='proximo';}
    return `<div class="venc-item">
      <div class="venc-dias ${dc}">${dl}</div>
      <div class="venc-info"><div class="venc-nome">${item.descricao}</div><div class="venc-data">${item.data}${item.quem?' · '+item.quem:''}</div></div>
      <div class="venc-valor aviso">R$ ${fmt(item.valor)}</div>
    </div>`;
  }).join('');
  return `<div class="table-card"><div class="chart-title">⏰ Vencimentos Próximos</div>${items.length?rows:'<div class="empty">Nenhuma conta a pagar</div>'}</div>`;
}

function renderUltimosLancamentos(dados) {
  const ultimos=[...dados].reverse().slice(0,12);
  const rows=ultimos.map(d=>{
    const bc=d.tipo==='Entrada'?'badge-entrada':d.tipo==='A Pagar'?'badge-pagar':'badge-saida';
    const em=d.tipo==='Entrada'?'💰':d.tipo==='A Pagar'?'📋':'💸';
    return `<tr>
      <td>${d.data}</td><td>${d.descricao}</td>
      <td><span class="badge ${bc}">${em} ${d.tipo}</span></td>
      <td style="text-align:right;font-weight:600">${d.tipo==='Entrada'?'<span class="positivo">':'<span class="negativo">'}R$ ${fmt(d.valor)}</span></td>
    </tr>`;
  }).join('');
  return `<div class="table-card wide"><div class="chart-title">📋 Últimos Lançamentos</div>${ultimos.length?`<table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Nenhum lançamento</div>'}</div>`;
}

// ─── CHART FUNCTIONS ──────────────────────────────────────────────────────────
const cOpts={responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#8888a8',font:{family:'DM Sans',size:12}}}},
  scales:{x:{ticks:{color:'#8888a8',font:{family:'DM Sans'}},grid:{color:'#2a2a38'}},
          y:{ticks:{color:'#8888a8',font:{family:'DM Sans'},callback:v=>'R$'+fmt(v)},grid:{color:'#2a2a38'}}}};

function renderChartBarras(dados) {
  const pm={};
  dados.forEach(d=>{if(!d.mesAno)return;if(!pm[d.mesAno])pm[d.mesAno]={ent:0,sai:0};
    if(d.tipo==='Entrada')pm[d.mesAno].ent+=d.valor;else if(d.tipo==='Saída')pm[d.mesAno].sai+=d.valor;});
  const labels=Object.keys(pm).sort().map(formatarMesAno);
  const ents=Object.keys(pm).sort().map(k=>pm[k].ent);
  const sais=Object.keys(pm).sort().map(k=>pm[k].sai);
  const ctx=document.getElementById('chart-barras').getContext('2d');
  chartInstances['barras']=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'Entradas',data:ents,backgroundColor:'#60f0a840',borderColor:'#60f0a8',borderWidth:2,borderRadius:6},
    {label:'Saídas',data:sais,backgroundColor:'#f0608040',borderColor:'#f06080',borderWidth:2,borderRadius:6},
  ]},options:{...cOpts,plugins:{...cOpts.plugins,tooltip:{callbacks:{label:c=>`R$ ${fmt(c.raw)}`}}}}});
}

function renderChartPizza(saidas) {
  const por={};saidas.forEach(d=>{por[d.categoria]=(por[d.categoria]||0)+d.valor;});
  const sorted=Object.entries(por).sort((a,b)=>b[1]-a[1]);
  const ctx=document.getElementById('chart-pizza').getContext('2d');
  chartInstances['pizza']=new Chart(ctx,{type:'doughnut',data:{labels:sorted.map(e=>e[0]),datasets:[{data:sorted.map(e=>e[1]),backgroundColor:CORES.map(c=>c+'99'),borderColor:CORES,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8888a8',font:{family:'DM Sans',size:11},boxWidth:12,padding:10}},tooltip:{callbacks:{label:c=>`R$ ${fmt(c.raw)}`}}}}});
}

function renderChartSaldo(todos) {
  const pm={};
  todos.forEach(d=>{if(!d.mesAno)return;if(!pm[d.mesAno])pm[d.mesAno]=0;
    if(d.tipo==='Entrada')pm[d.mesAno]+=d.valor;else if(d.tipo==='Saída')pm[d.mesAno]-=d.valor;});
  const meses=Object.keys(pm).sort();const saldos=[];let acum=0;
  meses.forEach(m=>{acum+=pm[m];saldos.push(acum);});
  const ctx=document.getElementById('chart-saldo').getContext('2d');
  chartInstances['saldo']=new Chart(ctx,{type:'line',data:{labels:meses.map(formatarMesAno),datasets:[{
    label:'Saldo acumulado',data:saldos,borderColor:'#c8f060',backgroundColor:'rgba(200,240,96,0.08)',
    borderWidth:2.5,pointBackgroundColor:saldos.map(v=>v>=0?'#c8f060':'#f06080'),pointRadius:5,fill:true,tension:0.4
  }]},options:{...cOpts,plugins:{...cOpts.plugins,tooltip:{callbacks:{label:c=>`R$ ${fmt(c.raw)}`}}}}});
}

function renderChartFormas(saidas) {
  const por={};saidas.forEach(d=>{const f=d.forma||'Não informado';por[f]=(por[f]||0)+d.valor;});
  const sorted=Object.entries(por).sort((a,b)=>b[1]-a[1]);
  const ctx=document.getElementById('chart-formas').getContext('2d');
  chartInstances['formas']=new Chart(ctx,{type:'doughnut',data:{labels:sorted.map(e=>e[0]),datasets:[{data:sorted.map(e=>e[1]),backgroundColor:CORES.slice(2).map(c=>c+'99'),borderColor:CORES.slice(2),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8888a8',font:{family:'DM Sans',size:11},boxWidth:12,padding:10}},tooltip:{callbacks:{label:c=>`R$ ${fmt(c.raw)}`}}}}});
}

function renderChartPessoas(saidas) {
  const por={};
  saidas.forEach(d=>{const p=d.quem||'Desconhecido';if(!por[p])por[p]={};por[p][d.categoria]=(por[p][d.categoria]||0)+d.valor;});
  const pessoas=Object.keys(por);
  if (!pessoas.length) return;
  const cats=[...new Set(saidas.map(d=>d.categoria))];
  const ctx=document.getElementById('chart-pessoas').getContext('2d');
  chartInstances['pessoas']=new Chart(ctx,{type:'bar',
    data:{labels:pessoas,datasets:cats.map((cat,i)=>({
      label:cat,data:pessoas.map(p=>por[p][cat]||0),
      backgroundColor:CORES[i%CORES.length]+'99',borderColor:CORES[i%CORES.length],borderWidth:1,borderRadius:4
    }))},
    options:{...cOpts,plugins:{...cOpts.plugins,tooltip:{callbacks:{label:c=>`${c.dataset.label}: R$ ${fmt(c.raw)}`}}},scales:{...cOpts.scales,x:{...cOpts.scales.x,stacked:true},y:{...cOpts.scales.y,stacked:true}}}
  });
}

function destroyCharts(){Object.values(chartInstances).forEach(c=>c.destroy());chartInstances={};}
function fmt(n){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

carregarDados();
</script>
